<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="customCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="50%" stop-color="#F0EAE0"/>
      <stop offset="100%" stop-color="#E2D6C6"/>
    </linearGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DCAC"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997722"/>
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2435"/>
      <stop offset="100%" stop-color="#4C141E"/>
    </linearGradient>
    <filter id="cstShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#141416" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="760" fill="url(#customCanvas)"/>
  <rect x="25" y="25" width="550" height="710" fill="none" stroke="#DCD1C2" stroke-width="1"/>
  <rect x="35" y="35" width="530" height="690" fill="none" stroke="#6A1E2D" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Category Badge Top -->
  <g transform="translate(300, 75)">
    <rect x="-130" y="-14" width="260" height="28" rx="14" fill="#FAF8F5" stroke="#6A1E2D" stroke-width="1"/>
    <text x="0" y="4" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#6A1E2D" text-anchor="middle" letter-spacing="2">
      CATEGORY 07 &bull; CUSTOM LINGERIE
    </text>
  </g>

  <!-- Central Custom Atelier Blueprint & Hardware Composition -->
  <g filter="url(#cstShadow)" transform="translate(300, 390)">
    
    <!-- Tech Pack CAD Grid Sheet -->
    <rect x="-190" y="-180" width="380" height="350" fill="#FFFFFF" stroke="#D8C8B8" stroke-width="2" rx="4"/>
    <g opacity="0.12" stroke="#6A1E2D" stroke-width="0.75">
      <line x1="-190" y1="-120" x2="190" y2="-120"/><line x1="-190" y1="-60" x2="190" y2="-60"/>
      <line x1="-190" y1="0" x2="190" y2="0"/><line x1="-190" y1="60" x2="190" y2="60"/><line x1="-190" y1="120" x2="190" y2="120"/>
      <line x1="-120" y1="-180" x2="-120" y2="170"/><line x1="-60" y1="-180" x2="-60" y2="170"/>
      <line x1="0" y1="-180" x2="0" y2="170"/><line x1="60" y1="-180" x2="60" y2="170"/><line x1="120" y1="-180" x2="120" y2="170"/>
    </g>

    <!-- Custom Cup CAD Geometry Lines -->
    <path d="M -120 40 C -120 -60, -45 -110, 0 -60 C 45 -110, 120 -60, 120 40 C 75 90, -75 90, -120 40 Z" fill="none" stroke="url(#wineGrad)" stroke-width="3"/>
    <circle cx="0" cy="-60" r="5" fill="url(#wineGrad)"/>

    <!-- Dimension Annotation Arcs -->
    <path d="M -90 -10 C -45 -40, 45 -40, 90 -10" fill="none" stroke="#6A1E2D" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="0" y="-20" font-family="'Space Mono', monospace" font-size="9" fill="#6A1E2D" text-anchor="middle" font-weight="700">ARC: 142mm</text>

    <!-- Bespoke Gold Alloy Hardware Monogram Plaque -->
    <g transform="translate(0, 90)">
      <rect x="-70" y="-18" width="140" height="36" rx="4" fill="url(#goldPlate)" stroke="#997722" stroke-width="1"/>
      <text x="0" y="5" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" font-weight="700" fill="#141416" text-anchor="middle" letter-spacing="2">ATS BESPOKE</text>
    </g>

    <!-- Pantone Color Swatches in Bottom Left -->
    <g transform="translate(-140, 90)">
      <rect x="0" y="0" width="18" height="24" fill="#6A1E2D" rx="2"/>
      <rect x="22" y="0" width="18" height="24" fill="#C59B9B" rx="2"/>
      <rect x="44" y="0" width="18" height="24" fill="#FAF8F5" stroke="#D8C8B8" rx="2"/>
    </g>
  </g>

  <!-- Editorial Footer -->
  <text x="300" y="685" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="600" fill="#141416" text-anchor="middle" letter-spacing="4">
    TECH PACK INTERPRETATION &bull; TOOLING
  </text>
  <text x="300" y="708" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#6A1E2D" text-anchor="middle" letter-spacing="2">
    ATS FASHION &amp; FABRICS &bull; GHAZIABAD
  </text>
</svg>
