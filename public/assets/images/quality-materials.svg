<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="qMatCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="50%" stop-color="#F2EDE6"/>
      <stop offset="100%" stop-color="#E5DCD0"/>
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2435"/>
      <stop offset="100%" stop-color="#4C141E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DCAC"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997722"/>
    </linearGradient>
    <pattern id="knitMicro" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 0 6 Q 3 0, 6 6 T 12 6" fill="none" stroke="#6A1E2D" stroke-width="0.75" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="url(#qMatCanvas)"/>
  <rect width="600" height="400" fill="url(#knitMicro)"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#DCD1C2" stroke-width="1"/>

  <!-- Macro Fiber Interlocking & Lingerie Material Emblem -->
  <g transform="translate(300, 195)">
    <!-- Silk Fabric Drape Vector in Background -->
    <path d="M -260 80 C -120 -40, 0 120, 140 -20 C 200 -80, 240 20, 260 80" fill="none" stroke="url(#wineGrad)" stroke-width="16" stroke-linecap="round" opacity="0.35"/>
    <path d="M -260 40 C -120 -80, 0 80, 140 -60 C 200 -120, 240 -20, 260 40" fill="none" stroke="url(#wineGrad)" stroke-width="12" stroke-linecap="round" opacity="0.2"/>

    <!-- Central Certified Seal -->
    <circle cx="0" cy="0" r="75" fill="#FAF8F5" stroke="url(#wineGrad)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="url(#gold)" stroke-width="1" stroke-dasharray="4,4"/>
    
    <text x="0" y="-18" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#6A1E2D" text-anchor="middle" letter-spacing="2">OEKO-TEX &bull; CLASS 1</text>
    <text x="0" y="7" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-weight="700" fill="#141416" text-anchor="middle">CERTIFIED</text>
    <text x="0" y="28" font-family="'Space Mono', monospace" font-size="8" font-weight="700" fill="#6A1E2D" text-anchor="middle">SKIN-SAFE DYES &amp; MODAL</text>
  </g>

  <!-- Bottom Spec Bar -->
  <text x="300" y="360" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#6A1E2D" text-anchor="middle" letter-spacing="1">
    SUPIMA COTTON &bull; MICRO-MODAL &bull; STRETCH LACE
  </text>
</svg>
