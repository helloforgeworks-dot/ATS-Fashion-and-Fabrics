<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="s3dBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F4EE"/>
      <stop offset="100%" stop-color="#E4DCD0"/>
    </linearGradient>
    <pattern id="knit3D" width="8" height="40" patternUnits="userSpaceOnUse">
      <line x1="2" y1="0" x2="2" y2="40" stroke="#6A1E2D" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="url(#s3dBg)"/>
  <rect width="600" height="450" fill="url(#knit3D)"/>

  <!-- 360 Dynamic Contour Visual -->
  <g transform="translate(300, 180)">
    <ellipse cx="0" cy="0" rx="140" ry="40" fill="none" stroke="#6A1E2D" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="110" ry="30" fill="none" stroke="#6A1E2D" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="0" y="5" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#6A1E2D" text-anchor="middle">360&deg; CIRCULAR KNIT</text>
  </g>

  <!-- Spec Chip -->
  <g transform="translate(300, 380)">
    <rect x="-170" y="-20" width="340" height="40" rx="4" fill="#FAF8F5" stroke="#6A1E2D" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#6A1E2D" text-anchor="middle" letter-spacing="2">
      3D CIRCULAR KNIT &bull; ZONED GSM
    </text>
  </g>
</svg>
