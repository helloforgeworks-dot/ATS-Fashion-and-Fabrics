<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F4EE"/>
      <stop offset="100%" stop-color="#EAE3D7"/>
    </linearGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8222"/>
    </linearGradient>
    <pattern id="patternGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6A1E2D" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#aboutBg)"/>
  <rect width="800" height="1000" fill="url(#patternGrid)"/>

  <!-- Atelier Frame Border -->
  <rect x="50" y="50" width="700" height="900" fill="none" stroke="#D5C7B6" stroke-width="1.5"/>

  <!-- Center Atelier Composition -->
  <g transform="translate(400, 480)">
    
    <!-- Tailor's French Curve & Pattern Grading Ruler -->
    <path d="M -260 -180 C -120 -280, 80 -220, 220 -80 C 280 -20, 260 120, 180 200 C 100 280, -60 260, -180 180 Z" fill="#FAF8F5" stroke="#6A1E2D" stroke-width="1.5" opacity="0.85"/>
    
    <!-- Measurement Ticks along Curve -->
    <path d="M -240 -170 L -230 -160 M -200 -200 L -192 -188 M -160 -225 L -154 -212 M -110 -245 L -107 -231 M -60 -252 L -59 -238 M 0 -245 L 0 -231 M 60 -225 L 57 -212 M 120 -190 L 114 -178 M 180 -140 L 171 -130" stroke="#6A1E2D" stroke-width="1" opacity="0.6"/>

    <!-- Tailor's Shears (Scissors) -->
    <g transform="translate(-40, 20) rotate(-35)">
      <!-- Blade 1 -->
      <path d="M 0 0 L 260 -15 L 0 -4 Z" fill="#3A3A3D" stroke="#1A1A1C" stroke-width="1"/>
      <path d="M 0 0 L 260 -15" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
      <!-- Blade 2 -->
      <path d="M 0 0 L 255 15 L 0 4 Z" fill="#505055" stroke="#1A1A1C" stroke-width="1"/>
      <!-- Pivot Gold Screw -->
      <circle cx="20" cy="0" r="8" fill="url(#goldSheen)" stroke="#1A1A1C" stroke-width="1"/>
      <!-- Handle Loop 1 -->
      <path d="M -20 -15 C -60 -50, -120 -40, -120 0 C -120 40, -60 40, -20 15" fill="none" stroke="url(#goldSheen)" stroke-width="12" stroke-linecap="round"/>
      <!-- Handle Loop 2 -->
      <path d="M -20 20 C -70 60, -140 60, -140 10 C -140 -20, -80 -10, -20 -5" fill="none" stroke="url(#goldSheen)" stroke-width="14" stroke-linecap="round"/>
    </g>

    <!-- Silk Spool with Flowing Thread -->
    <g transform="translate(160, 140)">
      <rect x="-30" y="-60" width="60" height="120" rx="6" fill="#6A1E2D"/>
      <rect x="-35" y="-70" width="70" height="12" rx="3" fill="#D4AF37"/>
      <rect x="-35" y="58" width="70" height="12" rx="3" fill="#D4AF37"/>
      <!-- Thread Lines -->
      <line x1="-30" y1="-40" x2="30" y2="-40" stroke="#8E2C40" stroke-width="2"/>
      <line x1="-30" y1="-20" x2="30" y2="-20" stroke="#8E2C40" stroke-width="2"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#8E2C40" stroke-width="2"/>
      <line x1="-30" y1="20" x2="30" y2="20" stroke="#8E2C40" stroke-width="2"/>
      <line x1="-30" y1="40" x2="30" y2="40" stroke="#8E2C40" stroke-width="2"/>
      <!-- Flowing Needle & Thread -->
      <path d="M 0 -60 C 40 -120, -80 -180, -140 -160 C -220 -140, -260 -60, -320 -100" fill="none" stroke="#6A1E2D" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,2"/>
      <!-- Gold Hand Sewing Needle -->
      <line x1="-320" y1="-100" x2="-360" y2="-120" stroke="url(#goldSheen)" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- CAD Pattern Drafting Label -->
    <g transform="translate(-180, -240)" font-family="'Space Mono', monospace" font-size="11" fill="#6A1E2D">
      <rect x="0" y="0" width="160" height="34" fill="#FFFFFF" stroke="#6A1E2D" stroke-width="1"/>
      <text x="12" y="22" font-weight="700">SPEC: ATELIER-01</text>
    </g>
  </g>

  <!-- Editorial Typography Header & Footer -->
  <text x="400" y="120" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-weight="600" fill="#6A1E2D" text-anchor="middle" letter-spacing="6">
    PRECISION CUTTING &bull; PATTERN GRADING
  </text>
  <text x="400" y="910" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#6E6E73" text-anchor="middle" letter-spacing="3">
    ATS FASHION &amp; FABRICS &bull; GHAZIABAD MANUFACTURING FACILITY
  </text>
</svg>
