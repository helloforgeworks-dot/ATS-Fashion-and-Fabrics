<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="braBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="50%" stop-color="#F2ECE4"/>
      <stop offset="100%" stop-color="#E5DCD0"/>
    </linearGradient>
    <linearGradient id="cupSatin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FAF5EE"/>
      <stop offset="100%" stop-color="#E8DEC8"/>
    </linearGradient>
    <linearGradient id="wine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7D2437"/>
      <stop offset="100%" stop-color="#4A131E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D59E"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997722"/>
    </linearGradient>
    <pattern id="braLace" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="9" fill="none" stroke="#6A1E2D" stroke-width="0.7" opacity="0.35"/>
      <circle cx="12" cy="12" r="3" fill="#6A1E2D" opacity="0.3"/>
      <path d="M 0 12 Q 6 3, 12 12 T 24 12" fill="none" stroke="#6A1E2D" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <filter id="braShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#141416" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="600" height="760" fill="url(#braBg)"/>
  <rect x="25" y="25" width="550" height="710" fill="none" stroke="#DCD1C2" stroke-width="1"/>
  <rect x="35" y="35" width="530" height="690" fill="none" stroke="#6A1E2D" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Category Badge Top -->
  <g transform="translate(300, 75)">
    <rect x="-100" y="-14" width="200" height="28" rx="14" fill="#FAF8F5" stroke="#6A1E2D" stroke-width="1"/>
    <text x="0" y="4" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#6A1E2D" text-anchor="middle" letter-spacing="2">
      CATEGORY 01 &bull; BRAS
    </text>
  </g>

  <!-- Central Luxury Balconette Bra Structure -->
  <g filter="url(#braShadow)" transform="translate(300, 390)">
    
    <!-- Satin Back Wings -->
    <path d="M -160 25 C -205 32, -240 45, -260 65 L -260 100 C -225 80, -185 70, -135 60 Z" fill="url(#cupSatin)" stroke="#D8C8B8" stroke-width="2"/>
    <path d="M 160 25 C 205 32, 240 45, 260 65 L 260 100 C 225 80, 185 70, 135 60 Z" fill="url(#cupSatin)" stroke="#D8C8B8" stroke-width="2"/>
    
    <!-- Hook & Eye Closure on Left Wing -->
    <rect x="-264" y="66" width="8" height="32" rx="2" fill="#E8DEC8" stroke="#6A1E2D" stroke-width="1"/>
    <circle cx="-260" cy="74" r="1.5" fill="#6A1E2D"/>
    <circle cx="-260" cy="82" r="1.5" fill="#6A1E2D"/>
    <circle cx="-260" cy="90" r="1.5" fill="#6A1E2D"/>

    <!-- Left Bra Cup -->
    <g transform="translate(-80, -20)">
      <!-- Cup Shell -->
      <path d="M -80 30 C -80 -55, -15 -95, 40 -60 C 75 -35, 80 25, 40 65 C 0 100, -70 90, -80 30 Z" fill="url(#cupSatin)" stroke="#CFC0AD" stroke-width="2"/>
      <path d="M -80 30 C -80 -55, -15 -95, 40 -60 C 75 -35, 80 25, 40 65 C 0 100, -70 90, -80 30 Z" fill="url(#braLace)"/>
      
      <!-- Underwire Channel in Burgundy -->
      <path d="M -80 30 C -65 90, 10 98, 40 65" fill="none" stroke="url(#wine)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M -80 30 C -65 90, 10 98, 40 65" fill="none" stroke="#FAF5EE" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>

      <!-- Vertical Shaping Seam -->
      <path d="M -20 -85 C -10 -15, 5 30, 0 80" fill="none" stroke="#6A1E2D" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7"/>

      <!-- Gold Ring at Apex -->
      <circle cx="-12" cy="-90" r="6.5" fill="none" stroke="url(#gold)" stroke-width="2"/>
      
      <!-- Strap -->
      <path d="M -12 -97 L -36 -230" stroke="url(#wine)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M -12 -97 L -36 -230" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

      <!-- Gold Slider -->
      <rect x="-30" y="-170" width="14" height="6" rx="1.5" fill="url(#gold)" transform="rotate(10, -23, -167)"/>
    </g>

    <!-- Right Bra Cup -->
    <g transform="translate(80, -20)">
      <!-- Cup Shell -->
      <path d="M 80 30 C 80 -55, 15 -95, -40 -60 C -75 -35, -80 25, -40 65 C 0 100, 70 90, 80 30 Z" fill="url(#cupSatin)" stroke="#CFC0AD" stroke-width="2"/>
      <path d="M 80 30 C 80 -55, 15 -95, -40 -60 C -75 -35, -80 25, -40 65 C 0 100, 70 90, 80 30 Z" fill="url(#braLace)"/>

      <!-- Underwire Channel in Burgundy -->
      <path d="M 80 30 C 65 90, -10 98, -40 65" fill="none" stroke="url(#wine)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M 80 30 C 65 90, -10 98, -40 65" fill="none" stroke="#FAF5EE" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>

      <!-- Vertical Shaping Seam -->
      <path d="M 20 -85 C 10 -15, -5 30, 0 80" fill="none" stroke="#6A1E2D" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7"/>

      <!-- Gold Ring at Apex -->
      <circle cx="12" cy="-90" r="6.5" fill="none" stroke="url(#gold)" stroke-width="2"/>

      <!-- Strap -->
      <path d="M 12 -97 L 36 -230" stroke="url(#wine)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 12 -97 L 36 -230" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

      <!-- Gold Slider -->
      <rect x="16" y="-170" width="14" height="6" rx="1.5" fill="url(#gold)" transform="rotate(-10, 23, -167)"/>
    </g>

    <!-- Center Bridge (Gore) & Satin Ribbon Charm -->
    <path d="M -40 40 L 40 40 L 0 56 Z" fill="#FAF8F5" stroke="#CFC0AD" stroke-width="2"/>
    <circle cx="0" cy="42" r="4.5" fill="url(#gold)"/>
    <path d="M -8 46 Q -14 60, -10 72" fill="none" stroke="url(#wine)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 8 46 Q 14 60, 10 72" fill="none" stroke="url(#wine)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Technical Specification Callouts -->
    <g opacity="0.8" font-family="'Space Mono', monospace" font-size="9" fill="#6A1E2D">
      <line x1="-180" y1="-60" x2="-180" y2="40" stroke="#6A1E2D" stroke-width="0.8" stroke-dasharray="2,2"/>
      <text x="-190" y="-10" text-anchor="end">MEMORY FOAM</text>
      
      <line x1="180" y1="-60" x2="180" y2="40" stroke="#6A1E2D" stroke-width="0.8" stroke-dasharray="2,2"/>
      <text x="190" y="-10" text-anchor="start">ERGONOMIC WIRE</text>
    </g>
  </g>

  <!-- Editorial Footer -->
  <text x="300" y="685" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="600" fill="#141416" text-anchor="middle" letter-spacing="4">
    WIRED &bull; WIRE-FREE &bull; BRALETTES
  </text>
  <text x="300" y="708" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#6A1E2D" text-anchor="middle" letter-spacing="2">
    ATS FASHION &amp; FABRICS &bull; GHAZIABAD
  </text>
</svg>
