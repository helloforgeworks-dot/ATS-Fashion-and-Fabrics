<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="laceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="100%" stop-color="#E7DEC8"/>
    </linearGradient>
    <pattern id="frenchFloral" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="20" fill="none" stroke="#6A1E2D" stroke-width="1" opacity="0.4"/>
      <circle cx="30" cy="30" r="10" fill="none" stroke="#6A1E2D" stroke-width="0.75" opacity="0.3"/>
      <circle cx="30" cy="30" r="3" fill="#6A1E2D" opacity="0.4"/>
      <path d="M 10 30 C 10 10, 50 10, 50 30 C 50 50, 10 50, 10 30 Z" fill="none" stroke="#6A1E2D" stroke-width="0.75" opacity="0.3"/>
      <path d="M 30 10 C 10 10, 10 50, 30 50 C 50 50, 50 10, 30 10 Z" fill="none" stroke="#6A1E2D" stroke-width="0.75" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="url(#laceBg)"/>
  <rect width="600" height="450" fill="url(#frenchFloral)"/>

  <!-- Scalloped Lace Border Header -->
  <path d="M 0 60 Q 30 20, 60 60 T 120 60 T 180 60 T 240 60 T 300 60 T 360 60 T 420 60 T 480 60 T 540 60 T 600 60" fill="none" stroke="#6A1E2D" stroke-width="3"/>

  <!-- Spec Chip -->
  <g transform="translate(300, 380)">
    <rect x="-170" y="-20" width="340" height="40" rx="4" fill="#FAF8F5" stroke="#6A1E2D" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#6A1E2D" text-anchor="middle" letter-spacing="2">
      FRENCH STRETCH LACE &bull; 120 GSM
    </text>
  </g>
</svg>
