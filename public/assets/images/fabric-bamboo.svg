<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F3"/>
      <stop offset="100%" stop-color="#ECE5D6"/>
    </linearGradient>
    <pattern id="bambooWeave" width="10" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="5" x2="10" y2="5" stroke="#6A1E2D" stroke-width="0.5" opacity="0.25"/>
      <line x1="5" y1="0" x2="5" y2="10" stroke="#6A1E2D" stroke-width="0.5" opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="url(#bamBg)"/>
  <rect width="600" height="450" fill="url(#bambooWeave)"/>

  <!-- Organic Bamboo Emblem -->
  <g transform="translate(300, 180)">
    <circle cx="0" cy="0" r="55" fill="#FAF8F5" stroke="#6A1E2D" stroke-width="2"/>
    <text x="0" y="-8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#6A1E2D" text-anchor="middle" letter-spacing="1.5">100% ORGANIC</text>
    <text x="0" y="14" font-family="'Cormorant Garamond', Georgia, serif" font-size="18" font-weight="700" fill="#141416" text-anchor="middle">BAMBOO</text>
  </g>

  <!-- Spec Chip -->
  <g transform="translate(300, 380)">
    <rect x="-170" y="-20" width="340" height="40" rx="4" fill="#FAF8F5" stroke="#6A1E2D" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#6A1E2D" text-anchor="middle" letter-spacing="2">
      95% ORGANIC BAMBOO &bull; 180 GSM
    </text>
  </g>
</svg>
