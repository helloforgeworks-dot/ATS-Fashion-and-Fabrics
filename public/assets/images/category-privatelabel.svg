<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="plCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="50%" stop-color="#F1ECE3"/>
      <stop offset="100%" stop-color="#E5DCD0"/>
    </linearGradient>
    <linearGradient id="luxuryBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242428"/>
      <stop offset="100%" stop-color="#0E0E10"/>
    </linearGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DCAC"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997722"/>
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2435"/>
      <stop offset="100%" stop-color="#4C141E"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#141416" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="600" height="760" fill="url(#plCanvas)"/>
  <rect x="25" y="25" width="550" height="710" fill="none" stroke="#DCD1C2" stroke-width="1"/>
  <rect x="35" y="35" width="530" height="690" fill="none" stroke="#6A1E2D" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Category Badge Top -->
  <g transform="translate(300, 75)">
    <rect x="-130" y="-14" width="260" height="28" rx="14" fill="#FAF8F5" stroke="#6A1E2D" stroke-width="1"/>
    <text x="0" y="4" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#6A1E2D" text-anchor="middle" letter-spacing="2">
      CATEGORY 08 &bull; PRIVATE LABEL
    </text>
  </g>

  <!-- Central Luxury Packaging Suite -->
  <g filter="url(#boxShadow)" transform="translate(300, 390)">
    
    <!-- Matte Black Rigid Gift Box (Isometric View) -->
    <path d="M -170 -40 L 0 -115 L 170 -40 L 170 85 L 0 160 L -170 85 Z" fill="url(#luxuryBox)" stroke="#424248" stroke-width="2"/>
    <path d="M 0 -115 L 0 160" stroke="#333338" stroke-width="2"/>

    <!-- Gold Foil Stamped Brand Crest on Box Lid -->
    <ellipse cx="0" cy="-40" rx="40" ry="20" fill="none" stroke="url(#goldFoil)" stroke-width="2"/>
    <text x="0" y="-34" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-weight="700" fill="url(#goldFoil)" text-anchor="middle" letter-spacing="3">ATS</text>

    <!-- Luxury Embossed Hangtag Floating at Angle -->
    <g transform="translate(65, 35) rotate(15)">
      <rect x="-50" y="-95" width="100" height="160" rx="4" fill="#FAF8F5" stroke="url(#wineGrad)" stroke-width="2"/>
      
      <!-- Hangtag Eyelet & Wine Braided Cord -->
      <circle cx="0" cy="-76" r="5" fill="#FAF8F5" stroke="url(#wineGrad)" stroke-width="1.8"/>
      <path d="M 0 -81 C 12 -115, -20 -145, 25 -190" fill="none" stroke="url(#wineGrad)" stroke-width="2" stroke-linecap="round"/>

      <!-- Brand Heading on Tag -->
      <text x="0" y="-35" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" font-weight="700" fill="#141416" text-anchor="middle">YOUR BRAND</text>
      <text x="0" y="-18" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#6A1E2D" text-anchor="middle" letter-spacing="1.5">INTIMATE APPAREL</text>

      <!-- Barcode Graphic -->
      <g transform="translate(-35, 8)">
        <line x1="0" y1="0" x2="0" y2="28" stroke="#141416" stroke-width="2.5"/>
        <line x1="7" y1="0" x2="7" y2="28" stroke="#141416" stroke-width="1.2"/>
        <line x1="14" y1="0" x2="14" y2="28" stroke="#141416" stroke-width="3"/>
        <line x1="23" y1="0" x2="23" y2="28" stroke="#141416" stroke-width="1.5"/>
        <line x1="32" y1="0" x2="32" y2="28" stroke="#141416" stroke-width="2.5"/>
        <line x1="42" y1="0" x2="42" y2="28" stroke="#141416" stroke-width="1"/>
        <line x1="50" y1="0" x2="50" y2="28" stroke="#141416" stroke-width="3"/>
        <line x1="60" y1="0" x2="60" y2="28" stroke="#141416" stroke-width="1.5"/>
        <line x1="70" y1="0" x2="70" y2="28" stroke="#141416" stroke-width="2.5"/>
      </g>
    </g>

    <!-- Woven Satin Neck Label (Floating in bottom left) -->
    <g transform="translate(-80, 75) rotate(-10)">
      <rect x="-45" y="-18" width="90" height="36" fill="#FAF8F5" stroke="#D8C8B8" stroke-width="1.5" rx="2"/>
      <text x="0" y="-3" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" font-weight="700" fill="#141416" text-anchor="middle">YOUR LOGO</text>
      <text x="0" y="10" font-family="'Space Mono', monospace" font-size="6" fill="#6A1E2D" text-anchor="middle">SIZE S/M &bull; 100% MODAL</text>
    </g>
  </g>

  <!-- Editorial Footer -->
  <text x="300" y="685" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="600" fill="#141416" text-anchor="middle" letter-spacing="4">
    HANGTAGS &bull; WOVEN LABELS &bull; LUXURY BOXES
  </text>
  <text x="300" y="708" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#6A1E2D" text-anchor="middle" letter-spacing="2">
    ATS FASHION &amp; FABRICS &bull; GHAZIABAD
  </text>
</svg>
