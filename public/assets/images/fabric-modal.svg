<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="mBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#E7DFD2"/>
    </linearGradient>
    <pattern id="modalKnit" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 0 6 Q 3 0, 6 6 T 12 6" fill="none" stroke="#6A1E2D" stroke-width="0.75" opacity="0.3"/>
      <path d="M 0 12 Q 3 6, 6 12 T 12 12" fill="none" stroke="#6A1E2D" stroke-width="0.75" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="url(#mBg)"/>
  <rect width="600" height="450" fill="url(#modalKnit)"/>

  <!-- Fluid Drapes -->
  <path d="M 0 150 C 150 250, 300 80, 600 200 L 600 450 L 0 450 Z" fill="#FAF8F5" opacity="0.6"/>
  <path d="M 0 250 C 200 350, 400 180, 600 320 L 600 450 L 0 450 Z" fill="#6A1E2D" opacity="0.08"/>

  <!-- Spec Chip -->
  <g transform="translate(300, 380)">
    <rect x="-160" y="-20" width="320" height="40" rx="4" fill="#FAF8F5" stroke="#6A1E2D" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#6A1E2D" text-anchor="middle" letter-spacing="2">
      92% MICRO-MODAL &bull; 170 GSM
    </text>
  </g>
</svg>
