<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="qCraftCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="50%" stop-color="#F2EDE6"/>
      <stop offset="100%" stop-color="#E5DCD0"/>
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2435"/>
      <stop offset="100%" stop-color="#4C141E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DCAC"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997722"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#qCraftCanvas)"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#DCD1C2" stroke-width="1"/>

  <!-- Macro Seam Engineering Visualization -->
  <g transform="translate(300, 190)">
    <!-- Silk Fabric Layers Being Joined -->
    <path d="M -260 -70 L 260 -70 L 260 -10 L -260 -10 Z" fill="#FFFFFF" stroke="#D8C8B8" stroke-width="1.5"/>
    <path d="M -260 10 L 260 10 L 260 70 L -260 70 Z" fill="#F8F4EE" stroke="#D8C8B8" stroke-width="1.5"/>

    <!-- 4-Thread Zero-Chafe Flatlock Stitch Join -->
    <g stroke="url(#wineGrad)" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M -240 -20 L -220 20 L -200 -20 L -180 20 L -160 -20 L -140 20 L -120 -20 L -100 20 L -80 -20 L -60 20 L -40 -20 L -20 20 L 0 -20 L 20 20 L 40 -20 L 60 20 L 80 -20 L 100 20 L 120 -20 L 140 20 L 160 -20 L 180 20 L 200 -20 L 220 20 L 240 -20"/>
      <line x1="-250" y1="-25" x2="250" y2="-25" stroke-dasharray="6,4" stroke="url(#gold)"/>
      <line x1="-250" y1="25" x2="250" y2="25" stroke-dasharray="6,4" stroke="url(#gold)"/>
    </g>

    <!-- Underwire Channel Casing Cross Section Detail -->
    <g transform="translate(0, 95)">
      <rect x="-160" y="-16" width="320" height="32" rx="4" fill="#FAF8F5" stroke="url(#wineGrad)" stroke-width="1.5"/>
      <text x="0" y="4" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#6A1E2D" text-anchor="middle" letter-spacing="1">
        ZERO-CHAFE FLATLOCK &bull; PLUSH CASING
      </text>
    </g>
  </g>

  <!-- Bottom Spec Bar -->
  <text x="300" y="360" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#6A1E2D" text-anchor="middle" letter-spacing="1">
    PRECISION STITCH DENSITY: 14 STITCHES / INCH
  </text>
</svg>
