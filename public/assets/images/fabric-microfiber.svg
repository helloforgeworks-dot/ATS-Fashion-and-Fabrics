<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="mfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F5F0"/>
      <stop offset="100%" stop-color="#E2DDD2"/>
    </linearGradient>
    <pattern id="mfGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#6A1E2D" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="url(#mfBg)"/>
  <rect width="600" height="450" fill="url(#mfGrid)"/>

  <!-- Laser Cut Bonded Edge Visual -->
  <g transform="translate(300, 200)">
    <path d="M -260 -60 Q 0 -20, 260 -60 L 260 60 Q 0 100, -260 60 Z" fill="#FAF8F5" stroke="#6A1E2D" stroke-width="2"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#6A1E2D" text-anchor="middle" letter-spacing="3">
      LASER-CUT BONDED RAW EDGE
    </text>
  </g>

  <!-- Spec Chip -->
  <g transform="translate(300, 380)">
    <rect x="-160" y="-20" width="320" height="40" rx="4" fill="#FAF8F5" stroke="#6A1E2D" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#6A1E2D" text-anchor="middle" letter-spacing="2">
      82% POLYAMIDE &bull; 140 GSM
    </text>
  </g>
</svg>
