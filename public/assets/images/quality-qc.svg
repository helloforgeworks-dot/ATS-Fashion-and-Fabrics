<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="qQcCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="50%" stop-color="#F2EDE6"/>
      <stop offset="100%" stop-color="#E5DCD0"/>
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2435"/>
      <stop offset="100%" stop-color="#4C141E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DCAC"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997722"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#qQcCanvas)"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#DCD1C2" stroke-width="1"/>

  <g transform="translate(300, 190)">
    <!-- Digital Caliper Gauge Measuring Seam Tolerance -->
    <g transform="translate(-85, -20)">
      <rect x="-105" y="-14" width="210" height="28" rx="3" fill="#222226" stroke="#141416" stroke-width="2"/>
      <rect x="-98" y="-9" width="85" height="18" fill="#C2D0BE" rx="2"/>
      <text x="-55" y="4" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#141416">&plusmn; 0.05 mm</text>
      <!-- Caliper Jaws Measuring Cup Rim -->
      <path d="M 95 -14 L 95 75 L 80 75 L 80 0" fill="#222226"/>
      <path d="M -15 -14 L -15 75 L 0 75 L 0 0" fill="#222226"/>
    </g>

    <!-- AQL 2.5 Quality Inspection Certificate Stamp -->
    <g transform="translate(125, 20) rotate(6)">
      <rect x="-75" y="-48" width="150" height="96" rx="6" fill="#FAF8F5" stroke="url(#wineGrad)" stroke-width="2.5"/>
      <rect x="-68" y="-41" width="136" height="82" fill="none" stroke="url(#wineGrad)" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="0" y="-15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#6A1E2D" text-anchor="middle" letter-spacing="2">PASSED</text>
      <text x="0" y="15" font-family="'Cormorant Garamond', Georgia, serif" font-size="26" font-weight="700" fill="#6A1E2D" text-anchor="middle">AQL 2.5</text>
      <text x="0" y="32" font-family="'Space Mono', monospace" font-size="7.5" font-weight="700" fill="#141416" text-anchor="middle">NEEDLE SCANNED</text>
    </g>
  </g>

  <!-- Bottom Spec Bar -->
  <text x="300" y="360" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#6A1E2D" text-anchor="middle" letter-spacing="1">
    TENSILE RECOVERY AUDIT &bull; 100% IN-LINE INSPECTION
  </text>
</svg>
