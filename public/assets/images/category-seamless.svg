<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="smlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="50%" stop-color="#F0EBE2"/>
      <stop offset="100%" stop-color="#E3D8CB"/>
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2435"/>
      <stop offset="100%" stop-color="#4C141E"/>
    </linearGradient>
    <pattern id="knitRib" width="5" height="40" patternUnits="userSpaceOnUse">
      <line x1="2" y1="0" x2="2" y2="40" stroke="#6A1E2D" stroke-width="0.8" opacity="0.25"/>
    </pattern>
    <filter id="smlShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#141416" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="760" fill="url(#smlBg)"/>
  <rect x="25" y="25" width="550" height="710" fill="none" stroke="#DCD1C2" stroke-width="1"/>
  <rect x="35" y="35" width="530" height="690" fill="none" stroke="#6A1E2D" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Category Badge Top -->
  <g transform="translate(300, 75)">
    <rect x="-120" y="-14" width="240" height="28" rx="14" fill="#FAF8F5" stroke="#6A1E2D" stroke-width="1"/>
    <text x="0" y="4" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#6A1E2D" text-anchor="middle" letter-spacing="2">
      CATEGORY 04 &bull; SEAMLESS WEAR
    </text>
  </g>

  <!-- Central Seamless 3D Knit Composition -->
  <g filter="url(#smlShadow)" transform="translate(300, 390)">
    
    <!-- Seamless Bralette Top -->
    <g transform="translate(0, -90)">
      <!-- Main Seamless Body -->
      <path d="M -140 -60 C -90 -90, 90 -90, 140 -60 L 125 70 C 65 90, -65 90, -125 70 Z" fill="#FFFFFF" stroke="#D8C8B8" stroke-width="2"/>
      <path d="M -140 -60 C -90 -90, 90 -90, 140 -60 L 125 70 C 65 90, -65 90, -125 70 Z" fill="url(#knitRib)"/>

      <!-- Wide Shoulder Straps -->
      <path d="M -140 -60 C -115 -120, -85 -160, -55 -170 L -25 -170 C -45 -120, -65 -80, -75 -40" fill="none" stroke="url(#wineGrad)" stroke-width="2.5"/>
      <path d="M 140 -60 C 115 -120, 85 -160, 55 -170 L 25 -170 C 45 -120, 65 -80, 75 -40" fill="none" stroke="url(#wineGrad)" stroke-width="2.5"/>

      <!-- Deep Scoop Neckline -->
      <path d="M -75 -40 C -35 -15, 35 -15, 75 -40" fill="none" stroke="url(#wineGrad)" stroke-width="2.5"/>

      <!-- 3D Engineered Underbust Compression Ribbing -->
      <path d="M -100 15 C -45 35, 45 35, 100 15" fill="none" stroke="#6A1E2D" stroke-width="2" stroke-dasharray="3,3"/>
      <path d="M -110 35 C -45 55, 45 55, 110 35" fill="none" stroke="#6A1E2D" stroke-width="2" stroke-dasharray="3,3"/>

      <!-- Seamless Laser-Dot Ventilation Mesh Matrix -->
      <g opacity="0.5" fill="#6A1E2D">
        <circle cx="-30" cy="-5" r="1.5"/><circle cx="-15" cy="-5" r="1.5"/><circle cx="0" cy="-5" r="1.5"/><circle cx="15" cy="-5" r="1.5"/><circle cx="30" cy="-5" r="1.5"/>
        <circle cx="-22" cy="5" r="1.5"/><circle cx="-7" cy="5" r="1.5"/><circle cx="7" cy="5" r="1.5"/><circle cx="22" cy="5" r="1.5"/>
      </g>

      <!-- Bonded Elastic Bottom Band -->
      <rect x="-125" y="65" width="250" height="15" fill="url(#wineGrad)" rx="2"/>
    </g>

    <!-- Seamless Laser-Cut Brief Bottom -->
    <g transform="translate(0, 115)">
      <path d="M -130 -30 C -45 -40, 45 -40, 130 -30 L 120 20 C 95 70, 45 110, 25 130 L -25 130 C -45 110, -95 70, -120 20 Z" fill="#FFFFFF" stroke="url(#wineGrad)" stroke-width="2"/>
      <path d="M -130 -30 C -45 -40, 45 -40, 130 -30 L 120 20 C 95 70, 45 110, 25 130 L -25 130 C -45 110, -95 70, -120 20 Z" fill="url(#knitRib)"/>
      <path d="M -130 -30 C -45 -40, 45 -40, 130 -30" fill="none" stroke="url(#wineGrad)" stroke-width="3.5" stroke-linecap="round"/>
      <text x="0" y="55" font-family="'Space Mono', monospace" font-size="8.5" font-weight="700" fill="#6A1E2D" text-anchor="middle" letter-spacing="1">BONDED ZERO-CHAFE</text>
    </g>
  </g>

  <!-- Editorial Footer -->
  <text x="300" y="685" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="600" fill="#141416" text-anchor="middle" letter-spacing="4">
    CIRCULAR KNIT &bull; LASER-CUT BONDED
  </text>
  <text x="300" y="708" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#6A1E2D" text-anchor="middle" letter-spacing="2">
    ATS FASHION &amp; FABRICS &bull; GHAZIABAD
  </text>
</svg>
