<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nightCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="50%" stop-color="#F2EBE1"/>
      <stop offset="100%" stop-color="#E5D9C8"/>
    </linearGradient>
    <linearGradient id="silkShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FAF5EE"/>
      <stop offset="80%" stop-color="#EBE0CF"/>
      <stop offset="100%" stop-color="#DAC8B0"/>
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2435"/>
      <stop offset="100%" stop-color="#4C141E"/>
    </linearGradient>
    <filter id="nightShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#141416" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="760" fill="url(#nightCanvas)"/>
  <rect x="25" y="25" width="550" height="710" fill="none" stroke="#DCD1C2" stroke-width="1"/>
  <rect x="35" y="35" width="530" height="690" fill="none" stroke="#6A1E2D" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Category Badge Top -->
  <g transform="translate(300, 75)">
    <rect x="-120" y="-14" width="240" height="28" rx="14" fill="#FAF8F5" stroke="#6A1E2D" stroke-width="1"/>
    <text x="0" y="4" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#6A1E2D" text-anchor="middle" letter-spacing="2">
      CATEGORY 06 &bull; NIGHTWEAR
    </text>
  </g>

  <!-- Central Silk Slip & Camisole Composition -->
  <g filter="url(#nightShadow)" transform="translate(300, 380)">
    
    <!-- Bias-Cut Silk Slip Dress Body -->
    <path d="M -85 -130 L -35 -150 L 35 -150 L 85 -130 L 175 230 C 90 255, -90 255, -175 230 Z" fill="url(#silkShimmer)" stroke="#D8C8B8" stroke-width="2"/>

    <!-- Spaghetti Straps -->
    <line x1="-65" y1="-138" x2="-45" y2="-230" stroke="url(#wineGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="65" y1="-138" x2="45" y2="-230" stroke="url(#wineGrad)" stroke-width="2" stroke-linecap="round"/>

    <!-- Eyelash Lace Trim Along Sweetheart Neckline -->
    <path d="M -85 -130 Q -35 -100, 0 -140 Q 35 -100, 85 -130" fill="none" stroke="url(#wineGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -85 -130 Q -35 -100, 0 -140 Q 35 -100, 85 -130" fill="none" stroke="#6A1E2D" stroke-width="0.8" stroke-dasharray="2,2"/>

    <!-- Fluid Drape Folds in Silk -->
    <path d="M -30 -80 C 45 10, -35 110, 25 210" fill="none" stroke="#6A1E2D" stroke-width="1" stroke-dasharray="4,4" opacity="0.45"/>
    <path d="M 45 -60 C -25 30, 65 130, -65 220" fill="none" stroke="#6A1E2D" stroke-width="1" stroke-dasharray="4,4" opacity="0.45"/>

    <!-- Delicate Scalloped Lace Hemline -->
    <path d="M -175 230 Q -90 250, 0 235 Q 90 250, 175 230" fill="none" stroke="url(#wineGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Editorial Footer -->
  <text x="300" y="685" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="600" fill="#141416" text-anchor="middle" letter-spacing="4">
    SATIN SLIPS &bull; MODAL CAMISOLES &bull; ROBES
  </text>
  <text x="300" y="708" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#6A1E2D" text-anchor="middle" letter-spacing="2">
    ATS FASHION &amp; FABRICS &bull; GHAZIABAD
  </text>
</svg>
