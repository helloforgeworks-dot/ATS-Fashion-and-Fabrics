<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="pnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F3EC"/>
      <stop offset="100%" stop-color="#E2DBD0"/>
    </linearGradient>
    <pattern id="powerMesh" width="14" height="14" patternUnits="userSpaceOnUse">
      <polygon points="7,0 14,7 7,14 0,7" fill="none" stroke="#6A1E2D" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="url(#pnBg)"/>
  <rect width="600" height="450" fill="url(#powerMesh)"/>

  <!-- High-Tension Compression Vectors -->
  <g transform="translate(300, 200)" stroke="#6A1E2D" stroke-width="2" fill="none">
    <path d="M -180 0 L 180 0"/>
    <path d="M -180 0 L -150 -15 M -180 0 L -150 15"/>
    <path d="M 180 0 L 150 -15 M 180 0 L 150 15"/>
    <text x="0" y="-20" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#6A1E2D" text-anchor="middle">DIRECTIONAL COMPRESSION</text>
  </g>

  <!-- Spec Chip -->
  <g transform="translate(300, 380)">
    <rect x="-170" y="-20" width="340" height="40" rx="4" fill="#FAF8F5" stroke="#6A1E2D" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#6A1E2D" text-anchor="middle" letter-spacing="2">
      HIGH-DENSITY POWERNET &bull; 240 GSM
    </text>
  </g>
</svg>
